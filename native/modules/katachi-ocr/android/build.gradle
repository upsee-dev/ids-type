plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.katachiocr'
version = '0.1.0'

android {
  namespace "expo.modules.katachiocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 日本語モデルを**APKに同梱する**版。未同梱版(text-recognition + Play services)は
  // 初回に落としに行くので、通信をしないという約束を破ってしまう
  implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
}
